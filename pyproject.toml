[project]
name = "cheap-flight-tracker"
version = "0.1.0"
description = "Watches live Google Flights prices and sends deal alerts via Telegram and email"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fast-flights==3.1.0",
  "typing_extensions>=4.12",
  "primp>=2.0,<3",
  "selectolax>=0.4,<0.5",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0",
  "croniter>=3.0",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[project.scripts]
cheap-flights = "cheap_flights.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheap_flights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: performs a real Google Flights search (network)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
